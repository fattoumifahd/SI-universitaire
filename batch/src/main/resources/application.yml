spring:
  application:
    name: batch
  datasource:
    url: jdbc:mysql://localhost:3306/batch_db
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false   # we trigger jobs manually

server:
  port: 8085