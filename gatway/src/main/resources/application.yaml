spring:
  application:
    name: gatway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:4200"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            allow-credentials: true
        add-to-simple-url-handler-mapping: true
      server:
        webflux:
          discovery:
            locator:
              enabled: true
    config:
      enabled: true
  config:
    import: configserver:http://localhost:1111


  main:
    web-application-type: reactive
logging:
  level:
    org.springframework.cloud.gateway: DEBUG

server:
  port: 9999
management:
  endpoints:
    web:
      exposure:
        include: "*"

